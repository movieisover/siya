name: 시야 공시 수집

on:
  schedule:
    # 평일 KST 09:00, 12:00, 15:00, 18:00 (UTC 00:00, 03:00, 06:00, 09:00)
    # 3시간 간격, 1일 4회 — GitHub Actions 사용량 절감 (2026-04-24 조정)
    - cron: '0 0,3,6,9 * * 1-5'
  workflow_dispatch:  # 수동 실행

jobs:
  collect-disclosures:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          pip install opendartreader python-dotenv supabase pandas

      - name: 공시 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          cd src/data/collectors
          python collect_disclosures.py
