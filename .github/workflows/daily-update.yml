name: 시야 일일 데이터 업데이트

on:
  schedule:
    # 매일 KST 16:30 (UTC 07:30) — 한국 장 마감 후
    - cron: '30 7 * * 1-5'  # 월~금만
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          pip install finance-datareader pykrx pandas numpy python-dotenv supabase requests

      - name: 일일 데이터 업데이트 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          cd src/data/collectors
          python daily_update.py
