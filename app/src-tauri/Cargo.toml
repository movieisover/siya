[package]
name = "siya"
version = "0.1.0"
description = "시야 — 한국 주식 가치투자 분석 PC 앱"
authors = ["you"]
edition = "2021"

[lib]
name = "siya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
